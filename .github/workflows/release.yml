name: Release
# Tag a version (v1.0.0, must match package.json) to build the Windows installers and attach
# them to a GitHub release. "Run workflow" builds without publishing and keeps the files as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the GitHub release for the current version
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the real app (Electron on Windows)
        run: npm run test:e2e
        env:
          SCRIBO_SCREENSHOT_DIR: ${{ runner.temp }}/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: ignore
      - name: Package
        run: npx electron-builder --win --publish never
      - name: Smoke test the installer (silent install, then run the installed app)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath release\Scribo-Setup-x64.exe -ArgumentList '/S' -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Scribo\Scribo.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Out-Host; throw "Scribo.exe was not installed to $exe" }
          $env:SCRIBO_EXE = $exe
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw 'installed app failed the smoke test' }
      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # one deterministic release instead of electron-builder's parallel uploads
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Scribo ${TAG#v}" --notes-file RELEASE_NOTES.md --verify-tag
          gh release upload "$TAG" --clobber \
            release/Scribo-Setup-x64.exe release/Scribo-Setup-x64.exe.blockmap \
            release/Scribo-Setup-arm64.exe release/Scribo-Setup-arm64.exe.blockmap \
            release/Scribo-Portable-x64.exe release/Scribo-Portable-arm64.exe \
            release/latest.yml
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        with:
          name: scribo-windows
          path: |
            release/Scribo-*.exe
            release/latest*.yml
          if-no-files-found: error
